name: Katkı yılanı

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: katki-yilani
  cancel-in-progress: true

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Katkı grafiğinden yılan SVG'lerini üret
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#087d61&color_dots=#ebedf0,#c2f2e1,#79e7c5,#2fae8a,#087d61
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#79e7c5&color_dots=#161b22,#12392f,#1d6652,#3fae8c,#79e7c5

      - name: SVG'leri output dalına yaz
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
